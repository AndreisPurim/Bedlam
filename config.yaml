run:
  base_dir: "runs"
  name: null

general:
  epochs: 3
  batch_size: 128
  lr: 0.001
  suppress_warnings: true
  log_level: "INFO"
  board_host: "localhost"
  board_port: 50051
  pairing_host: "localhost"
  pairing_port: 50052
  # model architectures: default | mlp | deep | resnet-lite
  # model_architecture: "mlp"
  # model_architecture: "default"
  model_architecture: "mlp"
  pad_multiple: 1024

  # architecture options:
  #   board-blind              -> per-receiver queues
  #   single-blind-two-pools   -> pooled audiences (to_m2, to_clients)
  #   single-blind-bucket      -> bucket-based board
  #   double-blind             -> dynamic pairing via DH + bucket board
  # architecture: "single-blind-bucket"
  architecture: "double-blind"

  m2_verbose: true
  m2_log_every: 50

  m1m3_verbose: true
  m1m3_log_every: 50

  board_verbose: true
  board_log_every: 100

double_blind:
  # number of peers for the double-blind approach (ignores peers.M1M3/M2)
  m1m3_count: 3
  m2_count: 2

peers:
  M2:
    - name: "m2_a"
      key: "super_secret_m2_a_key"
    - name: "m2_b"
      key: "super_secret_m2_b_key"

  M1M3:
    - name: "client_1"
      target_m2: "m2_a"
    - name: "client_2"
      target_m2: "m2_a"
    - name: "client_3"
      target_m2: "m2_b"
